[Server]
Port=3001
Host=localhost
Name=dbuildmcp
Version=1.1.0
Endpoint=/mcp

[CORS]
Enabled=1
AllowedOrigins=http://localhost,http://127.0.0.1,https://localhost,https://127.0.0.1

[SSL]
Enabled=0
CertFile=
KeyFile=
RootCertFile=

[MSBuild]
; RAD Studio installation path
BDSPath=C:\Program Files (x86)\Embarcadero\Studio\37.0
; .NET Framework path for MSBuild
FrameworkDir=C:\Windows\Microsoft.NET\Framework\v4.0.30319
; Default build settings
DefaultBuildType=Make
DefaultPlatform=Win64
DefaultConfig=Debug
DefaultVerbosity=quiet
; Show hints and warnings in output (0=false, only errors shown; 1=true, show all)
DefaultShowHintsAndWarnings=0
; Build timeout in milliseconds (10 minutes = 600000)
BuildTimeoutMs=600000
; Token-saving output limits (0 = unlimited):
; Max error lines shown on a failed build (per-call 'maxerrors' overrides; 1 = first error only)
DefaultMaxErrors=10
; Max hint/warning lines shown when DefaultShowHintsAndWarnings=1 (or showhintsandwarnings=true)
DefaultMaxHintsWarnings=30
; Hard ceiling on total output lines after filtering (head+tail kept so the summary survives)
MaxOutputLines=200
